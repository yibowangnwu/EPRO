name: CPU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: 4b26c788d41ce932ce7706c5ee8e249ab52f4c51
          path: third_party/verl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' -r requirements-test.txt
      - run: python scripts/install_verl.py third_party/verl
      - run: python scripts/install_verl.py third_party/verl
      - run: python -m pytest -q
        env:
          VERL_ROOT: ${{ github.workspace }}/third_party/verl
