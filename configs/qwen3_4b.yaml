defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - file://${oc.env:VERL_ROOT}/verl/trainer/config

data:
  train_files: [data/train.parquet]
  val_files: [data/val.parquet]
  train_batch_size: 256
  max_prompt_length: 1024
  max_response_length: 4096
  filter_overlong_prompts: true
  truncation: error
  shuffle: true
  seed: 42

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-4B-Base
    use_remove_padding: true
    use_fused_kernels: false
    enable_gradient_checkpointing: true
    lora_rank: 0
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 16
    ppo_epochs: 1
    shuffle: false
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 65536
    ppo_micro_batch_size_per_gpu: null
    use_fused_kernels: false
    entropy_coeff: 0.0
    use_kl_loss: false
    policy_loss:
      loss_mode: transported_sc
      rollout_correction:
        transported_sc: true
        tsc_tis_cap: 2.0
        tsc_div_delta: 0.125
        tsc_div_scale: 0.062
    loss_agg_mode: token-mean
    grad_clip: 1.0
    optim:
      optimizer: AdamW
      optimizer_impl: torch.optim
      lr: 1.0e-6
      betas: [0.9, 0.999]
      weight_decay: 0.01
      lr_scheduler_type: constant
      lr_warmup_steps_ratio: 0.0
    fsdp_config:
      dtype: bfloat16
      param_offload: false
      optimizer_offload: false
      ulysses_sequence_parallel_size: 1
      seed: 42
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    topk_log_probs: 32
    calculate_log_probs: true
    logprobs_mode: processed_logprobs
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 131072
    max_num_batched_tokens: 131072
    max_num_seqs: 256
    gpu_memory_utilization: 0.85
    load_format: dummy
    seed: 42
    val_kwargs:
      do_sample: true
      n: 8
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: false
    rollout_is: null
    rollout_rs: null
    score_centering: false

reward:
  custom_reward_function:
    path: ${oc.env:EPRO_ROOT}/epro/math_reward.py
    name: compute_score

trainer:
  use_v1: true
  v1:
    trainer_mode: sync
  n_gpus_per_node: 2
  nnodes: 1
  logger: [console]
  project_name: epro
  experiment_name: qwen3-4b-epro
  default_local_dir: checkpoints/qwen3-4b-epro
  total_epochs: 30
  total_training_steps: 400
  save_freq: 50
  test_freq: 50
  val_before_train: false

ray_kwargs:
  ray_init:
    runtime_env:
      py_executable: null
